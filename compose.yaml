name: salon-week

services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"
      SALON_TIME_ZONE: ${SALON_TIME_ZONE:-America/New_York}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your local .env file}
      SENTRY_DSN: ${SENTRY_DSN-https://b06b41ea85ddb3138f3151d71b1ba3da@o4512144504520704.ingest.us.sentry.io/4512144536895488}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local-docker}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-chairflow@poc}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-1.0}
    secrets:
      - source: rails_master_key
        target: /rails/config/master.key
    volumes:
      - salon_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    init: true
    restart: unless-stopped

secrets:
  rails_master_key:
    file: ./config/master.key

volumes:
  salon_storage:
