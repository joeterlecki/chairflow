services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    environment:
      RAILS_ENV: development
      # Puma's dev-server default binds only to loopback (127.0.0.1); inside a
      # container that's unreachable from the host's port mapping.
      BINDING: 0.0.0.0
    tty: true
    stdin_open: true
